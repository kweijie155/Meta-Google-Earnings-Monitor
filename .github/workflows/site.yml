name: Check SEC filings and deploy app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 23 * * *"   # daily 07:17 Singapore time: free SEC check, no Claude usage
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sec-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check SEC for new filings and headline figures
        # SEC sometimes refuses requests (403); don't let that block the site deploy
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python3 scripts/sec_check.py
      - name: Commit result if it changed
        id: commit
        run: |
          if git diff --quiet -- app/public/sec_latest.json && ! git ls-files --others --exclude-standard | grep -q sec_latest; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "sec-check-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/public/sec_latest.json
            git commit -m "SEC check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sec-check
    if: github.event_name != 'schedule' || needs.sec-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Build installable app
        working-directory: app
        run: |
          npm ci
          export BUILD_TIME="$(git log -1 --format=%cI -- src/data.json)"
          export BUILD_ID="$(git log -1 --format=%h -- src index.html vite.config.js package.json public/sw.js public/manifest.webmanifest)-$(date -d "$BUILD_TIME" +%s)"
          VITE_TARGET=pages npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist-pages }
      - id: deployment
        uses: actions/deploy-pages@v4
